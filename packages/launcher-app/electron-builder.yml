#
# Windows unpacked-directory target for the launcher-app control panel.
# Deferred (not in scope for this task): nsis installer, code signing,
# publish/auto-update.

appId: 'com.qwen-code.launcher-app'
productName: 'Qwen Remote Launcher'

directories:
  output: 'release'

files:
  - 'dist/**'
  - 'assets/**'
  - 'package.json'

win:
  target:
    - 'dir'
  # Tray icon (issue #49 follow-up) — the app must be visible without a window,
  # and this is also the exe icon. Native .ico, so no conversion step.
  icon: 'assets/icon.ico'
